[OpenStreetMap]
; Only explicit true enables the alternative source. Restart after editing.
;alternative_tile_source_enabled=false
;tile_src_url=https://tile.openstreetmap.org/{z}/{x}/{y}.png
; Request zoom = XYZ zoom + offset. Bounds are API request zoom levels.
;tile_zoom_offset=0
;tile_min_zoom=0
;tile_max_zoom=19
;tile_header_count=0
; Headers use the first colon as separator. Values are case-sensitive.
;tile_header_1=Header-Name:Header-Value

; NAVER Static Map satellite template: replace the active values above.
; The -1 offset is a verification candidate, not a verified tile alignment.
; https://www.ncloud-forums.com/topic/141/
; https://api.ncloud-docs.com/docs/ko/application-maps-static
;alternative_tile_source_enabled=true
;tile_src_url=https://maps.apigw.ntruss.com/map-static/v2/raster?crs=EPSG:4326&center={lon},{lat}&level={z}&w=256&h=256&scale=1&format=png&maptype=satellite
;tile_zoom_offset=-1
;tile_min_zoom=0
;tile_max_zoom=20
;tile_header_count=2
;tile_header_1=X-NCP-APIGW-API-KEY-ID:YOUR_API_KEY_ID
;tile_header_2=X-NCP-APIGW-API-KEY:YOUR_API_KEY
; Keep real credentials out of version control and distributed releases.